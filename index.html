<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Testing Lab: Ứng dụng Quản lý Công việc</title>
    <!-- Bootstrap 5 CDN cho styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-group-custom {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-group-custom input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group-custom input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group-custom button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 100px;
        }

        .input-group-custom button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-group-custom button:active {
            transform: translateY(0);
        }

        .counter-section {
            background: #f5f5f5;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-text {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .counter-number {
            font-size: 24px;
            color: #667eea;
            font-weight: 700;
        }

        .task-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .task-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .task-item.completed {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 16px;
            color: #333;
            word-break: break-word;
            transition: all 0.3s;
        }

        .task-id {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-left: 15px;
        }

        .task-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-done {
            background: #4caf50;
            color: white;
        }

        .btn-done:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-done.undo {
            background: #ff9800;
        }

        .btn-done.undo:hover {
            background: #e68900;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Responsive design */
        @media (max-width: 500px) {
            .container-main {
                padding: 25px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-group-custom {
                flex-direction: column;
            }

            .input-group-custom input {
                width: 100%;
            }

            .input-group-custom button {
                width: 100%;
            }

            .task-actions {
                flex-wrap: wrap;
            }

            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-actions {
                margin-left: 0;
                margin-top: 10px;
                width: 100%;
            }

            .task-actions button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header Section -->
        <div class="header">
            <h1>🚀 AI Testing Lab</h1>
            <h2>Ứng dụng Quản lý Công việc</h2>
            <p>Quản lý công việc hàng ngày của bạn một cách hiệu quả</p>
        </div>

        <!-- Input Section -->
        <div class="input-group-custom">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Nhập tên công việc (ví dụ: Mua sữa)..." 
                autocomplete="off"
            >
            <button id="addBtn" type="button">
                <i class="fas fa-plus"></i> Thêm
            </button>
        </div>

        <!-- Counter Section -->
        <div class="counter-section">
            <span class="counter-text">Công việc cần làm:</span>
            <span class="counter-number" id="taskCounter">0</span>
        </div>

        <!-- Task List Section -->
        <div class="task-list" id="taskList">
            <div class="empty-state">
                <i class="fas fa-tasks"></i>
                <p>Chưa có công việc nào. Hãy thêm công việc đầu tiên của bạn!</p>
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * AI Testing Lab - Task Manager Application
         * ==========================================
         * Ứng dụng quản lý công việc đơn giản
         * Sử dụng Vanilla JavaScript và localStorage
         */

        // ========================================
        // 1. KHỞI TẠO & CẤU HÌNH
        // ========================================

        const STORAGE_KEY = 'ai_testing_lab_tasks';

        // Các phần tử DOM
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const taskCounter = document.getElementById('taskCounter');

        // Biến lưu trữ dữ liệu công việc
        let tasks = [];

        /**
         * Khởi tạo ứng dụng
         * - Tải dữ liệu từ localStorage
         * - Gán event listeners
         * - Render UI
         */
        function initApp() {
            loadTasks();
            attachEventListeners();
            renderTasks();
            updateCounter();
        }

        // ========================================
        // 2. EVENT LISTENERS
        // ========================================

        /**
         * Gán các sự kiện cho các phần tử DOM
         */
        function attachEventListeners() {
            // Nút "Thêm" - Click event
            addBtn.addEventListener('click', handleAddTask);

            // Input field - Enter key event
            taskInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    handleAddTask();
                }
            });

            // Input field - Clear focus state khi click
            taskInput.addEventListener('blur', function() {
                this.value = this.value.trim();
            });
        }

        // ========================================
        // 3. XỬ LÝ CÔNG VIỆC (CRUD Operations)
        // ========================================

        /**
         * Xử lý thêm công việc mới
         */
        function handleAddTask() {
            const taskText = taskInput.value.trim();

            // Validation: Kiểm tra input không rỗng
            if (taskText === '') {
                alert('Vui lòng nhập tên công việc!');
                taskInput.focus();
                return;
            }

            // Validation: Giới hạn độ dài text
            if (taskText.length > 100) {
                alert('Tên công việc không được vượt quá 100 ký tự!');
                return;
            }

            // Tạo object công việc mới
            const newTask = {
                id: Date.now(), // Sử dụng timestamp làm unique ID
                text: taskText,
                completed: false,
                createdAt: new Date().toLocaleString('vi-VN')
            };

            // Thêm vào mảng tasks
            tasks.push(newTask);

            // Lưu vào localStorage
            saveTasks();

            // Cập nhật UI
            renderTasks();
            updateCounter();

            // Clear input
            taskInput.value = '';
            taskInput.focus();
        }

        /**
         * Xóa công việc theo ID
         * @param {number} taskId - ID của công việc cần xóa
         */
        function handleDeleteTask(taskId) {
            // Xác nhận trước khi xóa
            if (confirm('Bạn có chắc chắn muốn xóa công việc này?')) {
                // Lọc ra những task không có ID trùng
                tasks = tasks.filter(task => task.id !== taskId);

                // Lưu vào localStorage
                saveTasks();

                // Cập nhật UI
                renderTasks();
                updateCounter();
            }
        }

        /**
         * Đánh dấu công việc hoàn thành/chưa hoàn thành
         * @param {number} taskId - ID của công việc cần đánh dấu
         */
        function handleToggleComplete(taskId) {
            // Tìm task và toggle trạng thái completed
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;

                // Lưu vào localStorage
                saveTasks();

                // Cập nhật UI
                renderTasks();
                updateCounter();
            }
        }

        // ========================================
        // 4. QUẢN LÝ DỮ LIỆU (localStorage)
        // ========================================

        /**
         * Lưu dữ liệu tasks vào localStorage
         */
        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        /**
         * Tải dữ liệu tasks từ localStorage
         */
        function loadTasks() {
            const storedTasks = localStorage.getItem(STORAGE_KEY);
            if (storedTasks) {
                try {
                    tasks = JSON.parse(storedTasks);
                } catch (error) {
                    console.error('Lỗi khi parse localStorage:', error);
                    tasks = [];
                }
            } else {
                tasks = [];
            }
        }

        // ========================================
        // 5. RENDER & CẬP NHẬT UI
        // ========================================

        /**
         * Render danh sách công việc lên UI
         */
        function renderTasks() {
            // Xóa nội dung cũ
            taskList.innerHTML = '';

            // Nếu không có task nào, hiển thị empty state
            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tasks"></i>
                        <p>Chưa có công việc nào. Hãy thêm công việc đầu tiên của bạn!</p>
                    </div>
                `;
                return;
            }

            // Render từng task
            tasks.forEach(task => {
                const taskElement = createTaskElement(task);
                taskList.appendChild(taskElement);
            });
        }

        /**
         * Tạo element HTML cho một công việc
         * @param {object} task - Object chứa thông tin công việc
         * @returns {HTMLElement} Element của công việc
         */
        function createTaskElement(task) {
            const taskDiv = document.createElement('div');
            taskDiv.className = `task-item ${task.completed ? 'completed' : ''}`;
            taskDiv.setAttribute('data-task-id', task.id);

            // Nút "Đã xong" / "Hoàn tác"
            const toggleBtn = document.createElement('button');
            toggleBtn.className = `btn-done ${task.completed ? 'undo' : ''}`;
            toggleBtn.innerHTML = task.completed 
                ? '<i class="fas fa-undo"></i> Hoàn tác' 
                : '<i class="fas fa-check"></i> Đã xong';
            toggleBtn.addEventListener('click', () => handleToggleComplete(task.id));

            // Nút "Xóa"
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-delete';
            deleteBtn.innerHTML = '<i class="fas fa-trash"></i> Xóa';
            deleteBtn.addEventListener('click', () => handleDeleteTask(task.id));

            // Nội dung công việc
            const taskContent = document.createElement('div');
            taskContent.className = 'task-content';
            taskContent.innerHTML = `
                <div class="task-text">${escapeHtml(task.text)}</div>
                <div class="task-id">ID: ${task.id} | Tạo: ${task.createdAt}</div>
            `;

            // Nhóm nút hành động
            const taskActions = document.createElement('div');
            taskActions.className = 'task-actions';
            taskActions.appendChild(toggleBtn);
            taskActions.appendChild(deleteBtn);

            // Ghép các phần lại
            taskDiv.appendChild(taskContent);
            taskDiv.appendChild(taskActions);

            return taskDiv;
        }

        /**
         * Cập nhật bộ đếm công việc còn lại
         */
        function updateCounter() {
            const activeTasks = tasks.filter(task => !task.completed).length;
            taskCounter.textContent = activeTasks;
        }

        /**
         * Escape HTML để tránh XSS attack
         * @param {string} text - Text cần escape
         * @returns {string} Text đã escape
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================
        // 6. KHỞI ĐỘNG ỨNG DỤNG
        // ========================================

        // Chạy hàm khởi tạo khi DOM ready
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
